name: Validate

# Both checks are required before this repository can be submitted to the
# HACS default store, and they must keep passing afterwards. The nightly
# schedule catches breakage caused by changes outside this repository —
# a new Home Assistant release tightening hassfest, or the brands entry
# being removed.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
